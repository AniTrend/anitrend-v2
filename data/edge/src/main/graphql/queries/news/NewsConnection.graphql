query NewsConnection($after: String, $before: String, $limit: PositiveFloat) {
  news(after: $after, before: $before, limit: $limit) {
    count
    first
    last
    data {
      area
      category
      genre
      lang
      id
      title
      link
      image
      description
      content
      publishedOn
    }
  }
}

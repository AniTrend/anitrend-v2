fragment EdgeSchedule on SeriesSchedule {
  lastAiredEpisode {
    airDate
    episodeNumber
    id
    image
    name
    overview
    productionCode
    runtime
    seasonNumber
    tmdbId
  }
  lastAirDate
  firstAirDate
  nextEpisodeToAir {
    airDate
    episodeNumber
    id
    image
    name
    overview
    productionCode
    runtime
    seasonNumber
    tmdbId
  }
}

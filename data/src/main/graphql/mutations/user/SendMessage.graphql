mutation SendMessage(
    $id: Int,
    $locked: Boolean,
    $message: String,
    $isPrivate: Boolean,
    $recipientId: Int
) {
    SaveMessageActivity(
        id: $id,
        locked: $locked,
        message: $message,
        private: $isPrivate,
        recipientId: $recipientId,
    ) {
        ... FeedMessage
    }
}
mutation ToggleMangaFavourite($mangaId: Int, $scoreFormat: ScoreFormat) {
    ToggleFavourite(mangaId: $mangaId) {
        manga {
            edges {
                favouriteOrder
                node {
                    ... MediaCore
                }
                id
            }
            pageInfo {
                ... PageInfo
            }
        }
    }
}

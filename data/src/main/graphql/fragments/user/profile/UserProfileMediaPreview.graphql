fragment UserProfileMediaPreview on Media {
    id
    title {
        ... MediaTitle
    }
    coverImage {
        ... MediaImage
    }
    type
    format
    status(version: 2)
    episodes
    chapters
    volumes
    isFavourite
    isReviewBlocked
    meanScore
    averageScore
    favourites
    siteUrl
    mediaListEntry {
        id
        mediaId
        createdAt
        user {
            id
            name
            siteUrl
        }
        status
        progress
        progressVolumes
        updatedAt
    }
}

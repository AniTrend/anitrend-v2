query GetMediaWithAiring(
    $id: Int!,
    $notYetAired: Boolean,
    $page: Int!,
    $perPage: Int!,
    $scoreFormat: ScoreFormat
) {
    Media(id: $id) {
        airingSchedule(
            notYetAired: $notYetAired,
            page: $page,
            perPage: $perPage,
        ) {
            ... MediaAiringConnetion
        }
    }
}

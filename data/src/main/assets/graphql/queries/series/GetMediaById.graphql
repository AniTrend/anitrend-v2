query GetMediaById($id: Int!) {
  mediaById(id: $id) {
    id
    title {
      ... EdgeMediaTitle
    }
    cover {
      ... EdgeCover
    }
    banner
    description
    fanart
    format
    source
    status
    ageRating
    isAdult
    homepage
    airedEpisodes
    ageRating
    airedEpisodes
    broadcast
    chapters
    volumes
    kind
    moreInfo
    publishedFrom
    publishedTo
    mediaId {
      ... EdgeMediaId
    }
    images {
      ... EdgeImage
    }
    schedule {
      ... EdgeSchedule
    }
    networks {
      ... EdgeNetwork
    }
    themeSongs {
      ... EdgeTheme
    }
    trailers {
      ... EdgeTrailer
    }
    updatedAt
  }
}

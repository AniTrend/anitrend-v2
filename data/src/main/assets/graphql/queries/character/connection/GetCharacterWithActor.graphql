query GetCharacterWithActor(
    $page: Int,
    $perPage: Int,
    $id: Int,
    $type: MediaType = ANIME,
    $sort: [StaffSort],
    $language: StaffLanguage,
    $scoreFormat: ScoreFormat
) {
    Character(id: $id) {
        media(
            page: $page,
            perPage: $perPage,
            type: $type
        ) {
            ... CharacterStaffConnection
        }
    }
}

fragment UserProfileMediaPreview on Media {
    id
    title {
        ... MediaTitle
    }
    coverImage {
        ... MediaImage
    }
    type
    format
    status(version: 2)
    episodes
    chapters
    volumes
    isFavourite
    meanScore
    averageScore
    siteUrl
    mediaListEntry {
        status
        progress
        progressVolumes
        updatedAt
    }
}

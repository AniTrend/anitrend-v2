name: Skill Audit

on:
  pull_request:
    branches: [develop]
    paths:
      - "AGENTS.md"
      - ".agents/skills/**"
      - ".github/scripts/validate-skills.js"
      - ".github/workflows/skill-audit.yml"
      - "docs/support-arch/**"
      - "docs/superpowers/**"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [develop, master]
    paths:
      - "AGENTS.md"
      - ".agents/skills/**"
      - ".github/scripts/validate-skills.js"
      - ".github/workflows/skill-audit.yml"
      - "docs/support-arch/**"
      - "docs/superpowers/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1" # Every Monday at 08:00 UTC

jobs:
  validate:
    name: Validate skill files
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install dependencies
        run: npm ci

      - name: Run skill validator
        run: node .github/scripts/validate-skills.js

name-template: 'v$RESOLVED_VERSION'
tag-template: '$RESOLVED_VERSION'
categories:
  - title: '🚀 Features'
    labels:
      - ':star2: feature'
    collapse-after: 5
  - title: '✨ Improvements'
    labels:
      - ':wrench: enhancement'
    collapse-after: 5
  - title: '🛠️ Bug Fixes'
    labels:
      - ':adhesive_bandage: bug fix'
    collapse-after: 5
  - title: '🧰 Maintenance'
    labels:
      - ':hammer_and_wrench: refactor'
    collapse-after: 5
  - title: '📦 Dependencies'
    labels:
      - ':dagger: dependencies'
    collapse-after: 5
  - title: '🧪 Testing'
    labels:
      - ':test_tube: test'
    collapse-after: 5
  - title: '🏗️ Build & CI'
    labels:
      - ':building_construction: build'
      - ':construction_worker: ci'
    collapse-after: 5
  - title: '⏪ Reverts'
    labels:
      - ':rewind: revert'
    collapse-after: 5
  - title: '📚 Documentation'
    labels:
      - ':books: docs'
    collapse-after: 5
  - title: '🔖 Other changes'
autolabeler:
  - label: ':books: docs'
    files:
      - '*.md'
    branch:
      - '/docs\/.+/'
      - '/docs{0,1}\/.+/'  # Keep backward compatibility
  - label: ':adhesive_bandage: bug fix'
    branch:
      - '/fix\/.+/'
      - '/bugfix\/.+/'     # Keep backward compatibility
      - '/hotfix\/.+/'     # Keep backward compatibility
  - label: ':star2: feature'
    branch:
      - '/feat\/.+/'
      - '/feature\/.+/'    # Keep backward compatibility
  - label: ':wrench: enhancement'
    branch:
      - '/enhancement\/.+/'
  - label: ':hammer_and_wrench: refactor'
    branch:
      - '/refactor\/.+/'
  - label: ':dagger: dependencies'
    branch:
      - '/chore\/.+/'
      - '/dependencies\/.+/'  # Keep backward compatibility
      - '/renovate\/.+/'       # Keep backward compatibility
  - label: ':test_tube: test'
    branch:
      - '/test\/.+/'
  - label: ':building_construction: build'
    branch:
      - '/build\/.+/'
  - label: ':construction_worker: ci'
    branch:
      - '/ci\/.+/'
  - label: ':rewind: revert'
    branch:
      - '/revert\/.+/'
change-template: '- $TITLE by @$AUTHOR in #$NUMBER'
change-title-escapes: '\<*_&' # You can add # and @ to disable mentions, and add ` to disable code blocks.
version-resolver:
  major:
    labels:
      - ':cactus: breaking'
  minor:
    labels:
      - ':wrench: enhancement'
      - ':star2: feature'
  patch:
    labels:
      - ':adhesive_bandage: bug fix'
      - ':dagger: dependencies'
      - ':hammer_and_wrench: refactor'
  default: patch
exclude-labels:
  - ':skateboard: skip-changelog'
template: |
  # What's Changed

  $CHANGES
  
  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
